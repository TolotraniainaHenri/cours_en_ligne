# /etc/nginx/sites-available/formation-en-ligne  (remplacez exemple.com et le chemin si besoin)
#
# Principe : Nginx sert le dossier frontend/ (fichiers statiques) et envoie /api/ vers PHP-FPM.
# Le dossier backend/ (code, .env, logs) n'est JAMAIS dans la racine web : seul
# backend/public/index.php est exécuté, par le bloc "location /api/".

limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 80;
    server_name exemple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name exemple.com;

    # Certificat obtenu avec : sudo certbot --nginx -d exemple.com
    ssl_certificate     /etc/letsencrypt/live/exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemple.com/privkey.pem;

    root /var/www/formation-en-ligne/frontend;
    index index.html;
    client_max_body_size 1m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Couche supplémentaire anti force brute sur la connexion (10 requêtes/minute/IP)
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/formation-en-ligne/backend/public/index.php;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/formation-en-ligne/backend/public/index.php;
    }

    # Interdit les fichiers cachés (.env, .git...) sauf .well-known (certbot)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
